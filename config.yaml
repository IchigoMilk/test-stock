screening:
  # 空の場合は yfinance の Energy セクター情報 + フォールバック銘柄を利用
  tickers: []
  market_cap_min: 100000000
  market_cap_max: 20000000000
  top_n: 20

data:
  price_period: 6mo

scoring:
